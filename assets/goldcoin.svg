<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gold Farbverlauf -->
    <radialGradient id="goldGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff7b0"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#e6b800"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>

    <!-- Glanz -->
    <radialGradient id="shine" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Münzenrand -->
  <circle cx="100" cy="100" r="90" fill="#d4af37" stroke="#8c6a00" stroke-width="6"/>

  <!-- Münzenkörper -->
  <circle cx="100" cy="100" r="80" fill="url(#goldGradient)" />

  <!-- Innenring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#cfae2b" stroke-width="4"/>

  <!-- Glanz -->
  <circle cx="85" cy="80" r="50" fill="url(#shine)" />

  <!-- Symbol -->
  <text x="100" y="115" text-anchor="middle" font-size="50" font-family="Arial" fill="#8c6a00">$</text>

</svg>